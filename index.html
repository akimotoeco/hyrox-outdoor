function repWheels(reps,sets){for(const [id,min,max,val] of [['reps',0,Math.max(300,reps||0),reps||0],['sets',1,Math.max(50,sets||1),sets||1]]){let el=$(id);el.dataset.value=val;el.innerHTML=Array.from({length:max-min+1},(_,i)=>`<div data-n="${i+min}" class="${i+min===val?'chosen':''}">${i+min}</div>`).join('');let update=()=>{let n=Math.max(min,Math.min(max,min+Math.round(el.scrollTop/35)));el.dataset.value=n;for(let x of el.children)x.classList.toggle('chosen',Number(x.dataset.n)===n);$('repTotal').textContent='合計 '+Number($('reps').dataset.value||0)*Number($('sets').dataset.value||1)+'回'};el.addEventListener('scroll',update);el.addEventListener('click',e=>{if(e.target.dataset.n!=null){el.scrollTop=(Number(e.target.dataset.n)-min)*35;update()}});el.scrollTop=(val-min)*35;requestAnimationFrame(()=>{el.scrollTop=(val-min)*35;update()})} $('repTotal').textContent='合計 '+(reps||0)*(sets||1)+'回'}function changeDay(){$('dateEdit').classList.toggle('hide')}
function saveDay(){let target=$('newDate').value;if(!target||target===selected)return;if(!confirm(selected+' の全記録を '+target+' に移動しますか？'))return;const move=r=>{if(key(r.date)!==selected)return r;let d=new Date(r.date),[y,m,day]=target.split('-').map(Number);d.setFullYear(y,m-1,day);return {...r,date:d.toISOString()}};records=records.map(move);draft.items=draft.items.map(r=>records.find(x=>x.id===r.id)||move(r));write('hyrox_history',legacy().map(move));persist();selected=target;month=new Date(target+'T12:00:00');history()}
function settings(){$('app').innerHTML=`<section><h2>目標設定</h2><p class="muted">新しい種目はTRAININGの＋ボタンから追加できます。</p>${catalog().map((b,i)=>`<label>${esc(b[0])}<input data-name="${esc(b[0])}" value="${esc(goals[b[0]]||'')}" onchange="goals[this.dataset.name]=this.value;write('hp_goals',goals)"></label>`).join('')}</section><section><h2>データ保存</h2><p>ブラウザ内に保存。旧履歴の日付も変更できます。</p><button onclick="exportData()">JSONバックアップ</button></section>`}function openAdd(){if(timer.start||timer.elapsed){alert('計測中の種目を記録またはリセットしてから追加してください。');return}$('addPanel').classList.remove('hide');$('preset').innerHTML='<option value="">種目を選択</option>'+extraMenu.filter(x=>!catalog().some(b=>b[0].toLowerCase()===x[0].toLowerCase())).map(x=>`<option value="${esc(x[0])}">${esc(x[0])}</option>`).join('')+'<option value="__custom__">その他（自由入力）</option>';$('customLabel').classList.add('hide');$('custom').value='';$('addError').textContent='';$('preset').focus()}function closeAdd(){$('addPanel').classList.add('hide')}function pickPreset(){let manual=$('preset').value==='__custom__';$('customLabel').classList.toggle('hide',!manual);if(manual)$('custom').focus();$('addError').textContent=''}function addCustom(){let n=($('preset').value==='__custom__'?$('custom').value:$('preset').value).trim();if(!n){$('addError').textContent='種目名を入力してください。';return}let existing=catalog().find(x=>x[0].toLowerCase()===n.toLowerCase());if(existing)n=existing[0];else{custom.push(n);write('hp_custom',custom)}$('exercise').innerHTML=opts(catalog().map(x=>x[0]),n);choose(n);closeAdd();$('custom').value='';$('addError').textContent=''}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({records,legacy:legacy(),goals,custom},null,2)],{type:'application/json'}));a.download='hyrox-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();
</script></body></html>
