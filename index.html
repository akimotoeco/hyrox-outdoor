#555;border-radius:10px}</style></head><body><header><b>HYROX <span class="good">PERFORMANCE</span></b><br><small>FIELD TRAINING / v2.2</small></header><main id="app"></main><nav id="nav"></nav><script>
'use strict';const $=id=>document.getElementById(id),read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=x=>x===''||x==null?null:Number(x),fmt=s=>s==null?'—':`${Math.floor(s/60)}:${String(Math.round(s)%60).padStart(2,'0')}`,key=d=>{d=new Date(d);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const base=[['RUN',1000,0,0],['SKIERG',1000,0,0],['SLED PUSH',50,0,152],['SLED PULL',50,0,103],['BURPEE BROAD JUMP',80,0,0],['ROWING',1000,0,0],['FARMERS CARRY',200,0,24],['SANDBAG LUNGES',100,0,20],['WALL BALLS',0,100,6]];const formerExtras=[['BURPEES',0,20,0],['SQUAT',0,20,0],['DEADLIFT',0,5,0],['PULL-UPS',0,6,0],['DEAD HANG',0,0,0],['PUSH-UPS',0,20,0],['ROPE PULLDOWN',0,100,0],['DUMBBELL BACK LUNGE',0,25,14],['DUMBBELL FRONT LUNGE',0,10,14]];let custom=read('hp_custom',[]),goals=read('hp_goals',{}),records=read('hp_records',[]),draft=read('hp_draft',{place:'ゴールド浜松町',kind:'連続',items:[],id:Date.now(),start:new Date().toISOString()}),tab='TRAINING',month=new Date(),selected=key(new Date()),analysisName='RUN',editId=null,timer={start:null,elapsed:0};const places=['合同トレ','屋外','ゴールド浜松町','エニタイム','その他'];const catalog=()=>[...base,...custom.filter(n=>!base.some(b=>b[0]===n)).map(n=>formerExtras.find(b=>b[0]===n)||[n,0,0,0])];const opts=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');const field=(label,id,value,attrs='')=>`<label>${label}<input id="${id}" value="${esc(value??'')}" ${attrs}></label>`;const persist=()=>{write('hp_records',records);write('hp_draft',draft)};function switchTab(t){tab=t;editId=null;render()}function render(){ $('nav').innerHTML=['TRAINING','ANALYSIS','HISTORY','SETTINGS'].map(t=>`<button class="${tab===t?'active':''}" onclick="switchTab('${t}')">${t}</button>`).join('');({TRAINING:training,ANALYSIS:analysis,HISTORY:history,SETTINGS:settings}[tab])() }
function training(){let n=read('hp_choice','RUN');if(!catalog().some(b=>b[0]===n))n='RUN';$('app').innerHTML=`<section><h2>TRAINING</h2><div class="grid"><label>場所<select onchange="draft.place=this.value;persist()">${opts(places,draft.place)}</select></label><label>形式<select onchange="draft.kind=this.value;persist()">${opts(['連続','単独'],draft.kind)}</select></label></div><small>セッション内の記録 ${draft.items.length}種目</small></section><section><div class="exercise-head"><h2>種目</h2><button class="primary plus" aria-label="新しい種目を追加" onclick="openAdd()">＋</button></div><div id="addPanel" class="addpanel hide"><label>新しい種目名<input id="custom" placeholder="例：DUMBBELL ROW" maxlength="80"></label><div class="row"><button class="primary" onclick="addCustom()">追加して選択</button><button onclick="closeAdd()">取消</button></div><small id="addError" role="alert"></small></div><label>種目<select id="exercise" onchange="choose(this.value)">${opts(catalog().map(x=>x[0]),n)}</select></label><div id="entry"></div><div class="timer" id="clock">${fmt(elapsed())}</div><div class="row"><button onclick="toggleTimer()" id="timerBtn">${timer.start?'PAUSE':'START'}</button><button onclick="resetTimer()">RESET</button></div><button class="primary wide" style="margin-top:12px" onclick="addRecord()">種目を記録</button></section><section><h2>今回の記録</h2>${draft.items.map(r=>card(r,true)).join('')||'<small>まだ記録がありません</small>'}<button class="primary wide" onclick="finishSession()">セッション終了</button></section>`;entry(n)}
function choose(n){write('hp_choice',n);entry(n)}function entry(n,r=null){let b=catalog().find(x=>x[0]===n)||[n,0,0,0];let v=r||{distance:b[1],reps:b[2],weight:b[3],sets:1,note:goals[n]||''};$('entry').innerHTML=`<div class="grid">${field('距離 m','distance',v.distance,'type="number" min="0"')}${field('回数 / セット','reps',v.reps,'type="number" min="0"')}${field(n==='FARMERS CARRY'?'重量 kg（片手）':n==='SLED PUSH'||n==='SLED PULL'?'重量 kg（本体込み）':'重量 kg','weight',v.weight,'type="number" min="0" step="0.25"')}${field('セット数','sets',v.sets,'type="number" min="1"')}${field('タイム（秒・手入力可）','seconds',v.seconds,'type="number" min="0"')}${field('平均心拍 bpm','avg',v.avg,'type="number" min="1"')}${field('最大心拍 bpm','max',v.max,'type="number" min="1"')}${field('終了時心拍 bpm','end',v.end,'type="number" min="1"')}${field('1分後心拍 bpm','after',v.after,'type="number" min="1"')}${field('RPE 1〜10','rpe',v.rpe,'type="number" min="1" max="10"')}</div><label>目標・メモ<textarea id="note">${esc(v.note)}</textarea></label><small>ランジは左右合計。ダンベル・ファーマーズは片手重量。距離は全セット合計。</small>`}function elapsed(){return Math.floor(timer.elapsed+(timer.start?(Date.now()-timer.start)/1000:0))}function toggleTimer(){if(timer.start){timer.elapsed=elapsed();timer.start=null}else timer.start=Date.now();$('timerBtn').textContent=timer.start?'PAUSE':'RESUME'}function resetTimer(){timer={start:null,elapsed:0};if($('clock'))$('clock').textContent='0:00';if($('timerBtn'))$('timerBtn').textContent='START'}setInterval(()=>{if($('clock'))$('clock').textContent=fmt(elapsed())},250);
function collect(n){let r={name:n};for(let f of ['distance','reps','weight','sets','seconds','avg','max','end','after','rpe']){let el=$(f);if(!el.checkValidity()){el.reportValidity();return null}r[f]=num(el.value)}r.sets=r.sets||1;r.note=$('note').value;if(r.rpe!==null&&(r.rpe<1||r.rpe>10))return null;return r}function addRecord(){let r=collect($('exercise').value);if(!r)return;r.seconds=r.seconds??(elapsed()||null);Object.assign(r,{id:Date.now()+'-'+Math.random(),date:new Date().toISOString(),place:draft.place,kind:draft.kind,session:draft.id});records.push(r);draft.items.push(r);persist();resetTimer();render()}function finishSession(){if(!draft.items.length)return;if(!confirm('セッションを終了しますか？'))return;draft={place:draft.place,kind:draft.kind,items:[],id:Date.now(),start:new Date().toISOString()};persist();resetTimer();render()}
function card(r,editable){return `<div class="item"><strong>${esc(r.name)}</strong><div class="muted">${r.distance||0}m · ${r.reps||0}回 × ${r.sets||1} · ${r.weight||0}kg</div><div class="metric">${fmt(r.seconds)}</div><small>終了心拍 ${r.end??'—'} / 1分後 ${r.after??'—'} · RPE ${r.rpe??'—'}</small>${r.note?`<div class="goal">${esc(r.note)}</div>`:''}${editable?`<button onclick="editRecord('${r.id}')">編集</button>`:''}</div>`}function editRecord(id){let r=records.find(x=>x.id===id);if(!r)return;editId=id;$('app').innerHTML=`<section><h2>${esc(r.name)} / 記録編集</h2><div id="entry"></div><button class="primary" onclick="saveEdit()">保存</button> <button onclick="render()">取消</button> <button onclick="removeRecord()">削除</button></section>`;entry(r.name,r)}function saveEdit(){let r=records.find(x=>x.id===editId),v=collect(r.name);if(!v)return;Object.assign(r,v);draft.items=draft.items.map(x=>x.id===r.id?r:x);persist();render()}function removeRecord(){if(!confirm('この記録を削除しますか？'))return;records=records.filter(x=>x.id!==editId);draft.items=draft.items.filter(x=>x.id!==editId);persist();render()}
function comparable(a,b){return ['distance','reps','weight','sets','kind'].every(k=>a[k]===b[k])}function analysis(){let all=records.filter(r=>r.name===analysisName).sort((a,b)=>new Date(b.date)-new Date(a.date)),a=all[0],b=a&&all.slice(1).find(r=>comparable(a,r));let delta=(k)=>a&&b&&a[k]!=null&&b[k]!=null?a[k]-b[k]:null,hr=r=>r&&r.end!=null&&r.after!=null?r.end-r.after:null;let rows=[['タイム（秒）','seconds'],['平均心拍','avg'],['最大心拍','max'],['終了心拍','end'],['1分後心拍','after'],['RPE','rpe']];$('app').innerHTML=`<section><h2>種目別 ANALYSIS</h2><select class="wide" onchange="analysisName=this.value;analysis()">${opts([...new Set([...catalog().map(x=>x[0]),...records.map(r=>r.name)])],analysisName)}</select>${a?card(a,false):'<p>記録がありません</p>'}${a?`<small>最新：${key(a.date)} / ${esc(a.place)} / ${esc(a.kind)}</small>`:''}</section><section><h2>前回比較</h2>${b?`<small>同じ距離・回数・重量・セット・形式の前回：${key(b.date)} / ${esc(b.place)}</small><table><tr><th>項目</th><th>前回</th><th>今回</th><th>差</th></tr>${rows.map(([label,k])=>`<tr><td>${label}</td><td>${b[k]??'—'}</td><td>${a[k]??'—'}</td><td>${delta(k)===null?'—':(delta(k)>0?'+':'')+delta(k)}</td></tr>`).join('')}<tr><td>心拍回復幅</td><td>${hr(b)??'—'}</td><td>${hr(a)??'—'}</td><td>${hr(a)!=null&&hr(b)!=null?hr(a)-hr(b):'—'}</td></tr></table>`:'<p>同条件の過去記録がありません。</p>'}${a&&all[1]&&!comparable(a,all[1])?`<small>直前の記録は条件が異なるため別表示：${key(all[1].date)}</small>${card(all[1],false)}`:''}<small>心拍は環境・疲労・測定条件にも左右されます。</small></section><section><h2>タイム推移（同条件）</h2>${a?all.filter(r=>comparable(a,r)&&r.seconds!=null).slice(0,12).reverse().map(r=>`<div class="item"><small>${key(r.date)} · ${fmt(r.seconds)}</small><div class="bar" style="width:${Math.max(2,100*r.seconds/Math.max(1,...all.filter(x=>comparable(a,x)).map(x=>x.seconds||0)))}%"></div></div>`).join(''):''}</section><section><h2>全記録</h2>${all.map(r=>`<small>${key(r.date)} / ${esc(r.place)}</small>${card(r,true)}`).join('')}</section>`}
const legacy=()=>read('hyrox_history',[]);function history(){let y=month.getFullYear(),m=month.getMonth(),prefix=`${y}-${String(m+1).padStart(2,'0')}`,old=legacy(),monthR=records.filter(r=>key(r.date).startsWith(prefix)),monthO=old.filter(r=>key(r.date).startsWith(prefix)),days=new Set([...monthR,...monthO].map(r=>key(r.date))),sessions=new Set(monthR.map(r=>r.session));let cells=['日','月','火','水','木','金','土'].map(d=>`<small>${d}</small>`).join('')+'<span></span>'.repeat(new Date(y,m,1).getDay());for(let d=1;d<=new Date(y,m+1,0).getDate();d++){let k=prefix+'-'+String(d).padStart(2,'0');cells+=`<button class="${days.has(k)?'marked':''} ${selected===k?'active':''}" onclick="selected='${k}';history()">${d}</button>`}let sum=(arr,k)=>arr.reduce((s,r)=>s+(r[k]||0),0);$('app').innerHTML=`<section><div class="row"><button onclick="shift(-1)">‹</button><strong>${y}年${m+1}月</strong><button onclick="shift(1)">›</button></div><h3>${days.size}日 / ${sessions.size+monthO.length}セッション</h3><div class="daygrid">${cells}</div></section><section><h2>月間集計（新方式）</h2><div class="grid"><div>ラン距離<br><b>${(sum(monthR.filter(r=>r.name==='RUN'),'distance')/1000).toFixed(2)} km</b></div><div>種目計測時間<br><b>${fmt(sum(monthR,'seconds'))}</b></div></div>${places.map(p=>`<p>${p}：${new Set(monthR.filter(r=>r.place===p).map(r=>r.session)).size}回</p>`).join('')}${[...new Set(monthR.map(r=>r.name))].map(n=>`<small>${esc(n)}：${monthR.filter(r=>r.name===n).length}記録　</small>`).join('')}</section><section><h2>${selected} の記録</h2>${records.filter(r=>key(r.date)===selected).map(r=>`<small>${esc(r.place)} / ${esc(r.kind)}</small>${card(r,true)}`).join('')}${old.filter(r=>key(r.date)===selected).map(r=>`<details><summary>旧履歴 ${esc(r.mode||'')} · ${fmt(r.elapsed)}</summary>${(r.steps||[]).map((s,j)=>`<div class="item">${esc(s.name)}<br><small>${esc(s.detail)} · ${fmt(r.laps?.[j])}</small></div>`).join('')}<small>旧形式の記録（参照専用）</small></details>`).join('')}</section>`}function shift(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);selected=key(month);history()}
function settings(){$('app').innerHTML=`<section><h2>目標設定</h2><p class="muted">新しい種目はTRAININGの＋ボタンから追加できます。</p>${catalog().map((b,i)=>`<label>${esc(b[0])}<input data-name="${esc(b[0])}" value="${esc(goals[b[0]]||'')}" onchange="goals[this.dataset.name]=this.value;write('hp_goals',goals)"></label>`).join('')}</section><section><h2>データ保存</h2><p>ブラウザ内に保存。旧履歴は変更しません。</p><button onclick="exportData()">JSONバックアップ</button></section>`}function openAdd(){if(timer.start||timer.elapsed){alert('計測中の種目を記録またはリセットしてから追加してください。');return}$('addPanel').classList.remove('hide');$('custom').focus()}function closeAdd(){$('addPanel').classList.add('hide')}function addCustom(){let n=$('custom').value.trim();if(!n){$('addError').textContent='種目名を入力してください。';return}let existing=catalog().find(x=>x[0].toLowerCase()===n.toLowerCase());if(existing)n=existing[0];else{custom.push(n);write('hp_custom',custom)}$('exercise').innerHTML=opts(catalog().map(x=>x[0]),n);choose(n);closeAdd();$('custom').value='';$('addError').textContent=''}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({records,legacy:legacy(),goals,custom},null,2)],{type:'application/json'}));a.download='hyrox-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();
</script></body></html>
