<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><title>HYROX OUTDOOR</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#101114;color:#f5f4ee}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 18px 90px;max-width:600px;margin:auto}header{padding:24px 0 14px;border-bottom:1px solid #333}small,.muted{color:#999}h1{font-size:26px;letter-spacing:2px;margin:4px 0}h2{font-size:17px}button,input,select{font:inherit}button{background:#e6fa62;color:#111;border:0;border-radius:10px;padding:13px 18px;font-weight:750}button.secondary{background:#292b30;color:#eee}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1}.tabs button.active{background:#e6fa62;color:#111}.panel{background:#1c1e22;border:1px solid #35363a;border-radius:16px;padding:18px;margin:12px 0}.timer{font-size:52px;font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-2px}.step{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #34363a;padding:12px 0}.step:last-child{border:0}.step.done{opacity:.48}.step strong{display:block}.step span{font-size:13px;color:#aaa}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.controls button{flex:1}.tag{font-size:12px;background:#34363a;border-radius:5px;padding:5px 8px;color:#ddd}input,select{width:100%;padding:11px;background:#111216;color:white;border:1px solid #444;border-radius:8px;margin-top:6px}label{display:block;font-size:13px;color:#bbb;margin:12px 0}.hide{display:none}.big{font-size:28px;font-weight:800}footer{color:#888;font-size:12px;margin:25px 0}</style></head><body><header><small>99T HERITAGE / FIELD TRAINING</small><h1>HYROX <span style="color:#e6fa62">OUTDOOR</span></h1><small>INOKASHIRA WEST PARK · SESSION TRACKER</small></header><nav class="tabs"><button id="tabTrain" class="active" onclick="tab('train')">SESSION</button><button id="tabHistory" class="secondary" onclick="tab('history')">HISTORY</button><button id="tabSettings" class="secondary" onclick="tab('settings')">SETTINGS</button></nav><main id="train"><div class="panel"><small>ELAPSED TIME</small><div class="timer" id="clock">00:00:00</div><div class="controls"><button id="startBtn" onclick="toggleTimer()">START</button><button class="secondary" onclick="finish()">FINISH & SAVE</button></div></div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>WORKOUT FLOW</h2><span class="tag" id="progress">0 / 12</span></div><div id="steps"></div></div><div class="panel"><h2>DEAD HANG TIMER</h2><div class="big" id="hangClock">00:30</div><div class="controls"><button onclick="hangStart()">START / PAUSE</button><button class="secondary" onclick="hangReset()">RESET</button></div><small>設定画面で目標秒数を変更できます。</small></div></main><main id="history" class="hide"><div class="panel"><h2>SESSION HISTORY</h2><div id="historyList"></div></div></main><main id="settings" class="hide"><div class="panel"><h2>WORKOUT SETTINGS</h2><label>ランニング距離（各セット）<select id="runDistance" onchange="updateSettings()"><option value="800">800m</option><option value="1000">1km</option></select></label><label>デッドハング目標秒数<input id="hangTarget" type="number" min="5" max="300" value="30" onchange="updateSettings()"></label><label>懸垂回数<input id="pullups" type="number" min="1" max="100" value="6" onchange="updateSettings()"></label><label>ランジ歩数<input id="lunges" type="number" min="1" max="300" value="40" onchange="updateSettings()"></label><label>腕立て回数<input id="pushups" type="number" min="1" max="300" value="20" onchange="updateSettings()"></label><label>バーピー回数<input id="burpees" type="number" min="1" max="300" value="15" onchange="updateSettings()"></label><label>バーピーブロードジャンプ距離(m)<input id="broad" type="number" min="1" max="200" value="20" onchange="updateSettings()"></label><button class="secondary" onclick="resetSession()">RESET CURRENT SESSION</button></div></main><footer>記録はこの端末のブラウザ内に保存されます。ブラウザのデータ消去時には失われる場合があります。</footer><script>
const defaults={runDistance:800,hangTarget:30,pullups:6,lunges:40,pushups:20,burpees:15,broad:20};let cfg={...defaults,...JSON.parse(localStorage.getItem('hyrox_cfg')||'{}')};let session=JSON.parse(localStorage.getItem('hyrox_session')||'null')||{done:[],laps:[],elapsed:0,running:false};session.running=false;let started=0;let hangLeft=cfg.hangTarget,hangRunning=false,hangStarted=0;const pad=n=>String(n).padStart(2,'0');const fmt=s=>`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(Math.floor(s%60))}`;function stepsData(){return Array.from({length:6},(_,i)=>[{name:'RUN',detail:cfg.runDistance+'m'},{name:['BURPEE BROAD JUMP','WALKING LUNGE','PULL-UPS','DEAD HANG','PUSH-UPS','BURPEES'][i],detail:[cfg.broad+'m',cfg.lunges+' steps',cfg.pullups+' reps',cfg.hangTarget+' sec',cfg.pushups+' reps',cfg.burpees+' reps'][i]}]).flat()};function save(){localStorage.setItem('hyrox_session',JSON.stringify(session))}function render(){document.getElementById('clock').textContent=fmt(session.elapsed+(session.running?(Date.now()-started)/1000:0));document.getElementById('startBtn').textContent=session.running?'PAUSE':'START';document.getElementById('progress').textContent=session.done.length+' / 12';document.getElementById('steps').innerHTML=stepsData().map((s,i)=>`<div class="step ${session.done.includes(i)?'done':''}"><div><small>${pad(i+1)} / ${i%2===0?'RUN':'STATION'}</small><strong>${s.name}</strong><span>${s.detail}${session.laps[i]!==undefined?' · '+fmt(session.laps[i]):''}</span></div><button class="${session.done.includes(i)?'secondary':''}" onclick="complete(${i})">${session.done.includes(i)?'UNDO':'DONE'}</button></div>`).join('');document.getElementById('hangClock').textContent=`${pad(Math.floor(hangLeft/60))}:${pad(Math.ceil(hangLeft%60))}`;}function complete(i){if(session.done.includes(i)){session.done=session.done.filter(x=>x!==i);delete session.laps[i]}else{session.done.push(i);session.laps[i]=Math.round(session.elapsed+(session.running?(Date.now()-started)/1000:0))}save();render()}function toggleTimer(){if(session.running){session.elapsed+=(Date.now()-started)/1000;session.running=false}else{started=Date.now();session.running=true}save();render()}function finish(){if(!confirm('今回のセッションを保存しますか？'))return;let elapsed=Math.round(session.elapsed+(session.running?(Date.now()-started)/1000:0));let history=JSON.parse(localStorage.getItem('hyrox_history')||'[]');history.unshift({date:new Date().toISOString(),elapsed,done:session.done.length,laps:session.laps,config:{...cfg}});localStorage.setItem('hyrox_history',JSON.stringify(history));resetSession();tab('history')}function resetSession(){session={done:[],laps:[],elapsed:0,running:false};save();hangReset();render()}function hangStart(){if(hangRunning){hangLeft=Math.max(0,hangLeft-(Date.now()-hangStarted)/1000);hangRunning=false}else if(hangLeft>0){hangStarted=Date.now();hangRunning=true}}function hangReset(){hangRunning=false;hangLeft=cfg.hangTarget;render()}function updateSettings(){Object.keys(defaults).forEach(k=>cfg[k]=Number(document.getElementById(k).value)||defaults[k]);localStorage.setItem('hyrox_cfg',JSON.stringify(cfg));hangReset();render()}function renderHistory(){let history=JSON.parse(localStorage.getItem('hyrox_history')||'[]');document.getElementById('historyList').innerHTML=history.length?history.map((h,i)=>`<div class="step"><div><strong>${new Date(h.date).toLocaleString('ja-JP')}</strong><span>${fmt(h.elapsed)} · ${h.done}/12 completed · run ${h.config.runDistance}m</span></div><button class="secondary" onclick="deleteHistory(${i})">削除</button></div>`).join(''):'まだ記録はありません。'}function deleteHistory(i){if(!confirm('この履歴を削除しますか？'))return;let h=JSON.parse(localStorage.getItem('hyrox_history')||'[]');h.splice(i,1);localStorage.setItem('hyrox_history',JSON.stringify(h));renderHistory()}function tab(t){['train','history','settings'].forEach(x=>{document.getElementById(x).classList.toggle('hide',x!==t);let b=document.getElementById('tab'+x[0].toUpperCase()+x.slice(1));b.className=x===t?'active':'secondary'});if(t==='history')renderHistory()}Object.keys(defaults).forEach(k=>document.getElementById(k).value=cfg[k]);setInterval(()=>{if(hangRunning){let left=hangLeft-(Date.now()-hangStarted)/1000;if(left<=0){hangLeft=0;hangRunning=false;if(navigator.vibrate)navigator.vibrate([200,100,200])}document.getElementById('hangClock').textContent=`${pad(Math.floor(Math.max(0,left)/60))}:${pad(Math.ceil(Math.max(0,left)%60))}`}if(session.running)document.getElementById('clock').textContent=fmt(session.elapsed+(Date.now()-started)/1000)},200);render();
</script></body></html>
